name: replicate-reference-muon-seed2-200m
model: ../model/gpt_35m.yaml
data: ../data/fineweb_edu_75m.yaml
optimizer: ../optimizer/muon.yaml
training:
  global_batch_tokens: 32768
  max_tokens: 200000000
  learning_rate: 0.02
  weight_decay: 0.01
  warmup_fraction: 0.05
  min_lr_fraction: 0.1
  seed: 2
  precision: bf16
  gradient_clip_norm: 1.0
