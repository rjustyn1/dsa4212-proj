name: screen-shared-rate-extension-40m
branch: experiment/moonlight-lr-extension
model: ../model/gpt_35m.yaml
data: ../data/fineweb_edu_75m.yaml
seed: 101
max_tokens: 40000000
comparison:
  primary: token_normalised_validation_nll_area
  candidate_rates: [0.0024, 0.0048, 0.0096]
  moonlight_muon: [0.0096]
  soap_muon:
    route: both
    all_parameter_groups_share_candidate_rate: true
    rates: [0.0024, 0.0048, 0.0096]
training:
  global_batch_tokens: 32768
  warmup_fraction: 0.05
  min_lr_fraction: 0.1
  precision: bf16
  gradient_clip_norm: 1.0
evaluation:
  curve_validation_tokens: 1000000
  curve_interval_tokens: 10000000
