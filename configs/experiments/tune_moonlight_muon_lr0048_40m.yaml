name: tune-moonlight-muon-lr0048-40m
model: ../model/gpt_35m.yaml
data: ../data/fineweb_edu_75m.yaml
optimizer: ../optimizer/moonlight_muon_reference.yaml
training:
  global_batch_tokens: 32768
  max_tokens: 40000000
  learning_rate: 0.0048
