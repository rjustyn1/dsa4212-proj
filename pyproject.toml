[project]
name = "project"
version = "0.1.0"
description = "Experiments on selective one-sided SOAP-Muon for Transformer training"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0",
    "modal",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "torch>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
